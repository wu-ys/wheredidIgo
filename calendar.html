<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <title>Where did I go</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-gpx"></script>

  <style>
    body { margin: 0; padding: 0; }
    /* === 顶部导航栏样式 === */
    #navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 50px;
      background-color: #1e293b;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      font-family: sans-serif;
      z-index: 1000;
    }

    #navbar .nav-left .logo {
      font-weight: bold;
      font-size: 18px;
    }

    #navbar .nav-center a {
      color: white;
      text-decoration: none;
      margin: 0 10px;
      font-size: 15px;
    }

    #navbar .nav-center a:hover {
      text-decoration: underline;
    }

    #navbar .nav-right select {
      background-color: #1e293b;
      color: white;
      border: 1px solid #475569;
      border-radius: 4px;
      padding: 3px 6px;
    }

    /* === 地图容器偏移（避免被导航栏遮挡） === */
    #map {
      height: calc(100vh - 50px);
      width: 100%;
      margin-top: 50px;
    }

    /* === 浮动日期选择面板 === */
    #date-panel {
      position: fixed;
      top: 70px;
      right: 15px;
      background: rgba(30, 41, 59, 0.92);
      border-radius: 8px;
      padding: 12px 15px;
      z-index: 1001;
      font-family: sans-serif;
      color: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 180px;
    }

    #date-panel label {
      font-size: 13px;
      color: #94a3b8;
    }

    #date-panel input[type="date"] {
      background: #1e293b;
      color: white;
      border: 1px solid #475569;
      border-radius: 4px;
      padding: 5px 8px;
      font-size: 14px;
      width: 100%;
      box-sizing: border-box;
    }

    #date-panel input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
    }

    #date-status {
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
      min-height: 16px;
    }

    #mode-toggle {
      background: #475569;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
      width: 100%;
    }

    #mode-toggle:hover {
      background: #64748b;
    }

    #mode-toggle.active {
      background: #e11d48;
    }
  </style>
</head>
<body>

<nav id="navbar">
  <div class="nav-left">
    <span class="logo" data-i18n="title">🌏 Where did I go</span>
  </div>

  <div class="nav-center">
    <a href="index.html" data-i18n="nav.home">Home</a>
    <a href="flights.html" data-i18n="nav.flights">Flights</a>
    <a href="railway.html" data-i18n="nav.railway">Railways</a>
    <a href="points.html" data-i18n="nav.points">Landmarks</a>
    <a href="calendar.html" data-i18n="nav.dates">By Date</a>
  </div>

  <div class="nav-right">
    <select id="langSelect">
      <option value="zh">中文</option>
      <option value="en">English</option>
    </select>
  </div>
</nav>

<div id="map"></div>

<div id="date-panel">
  <label for="dateInput" data-i18n="dates.pick">Pick a date</label>
  <input type="date" id="dateInput" />
  <div id="date-status"></div>
  <button id="mode-toggle" data-i18n="dates.dots">Dots</button>
</div>

<script>

  function getQueryParam(param) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(param);
  }

  let currentLang = getQueryParam("lang") || localStorage.getItem("lang") || "zh";
  localStorage.setItem("lang", currentLang);
  document.getElementById("langSelect").value = currentLang;

  async function loadLanguage(lang) {
    try {
      const resp = await fetch("lang.json");
      const data = await resp.json();
      const dict = data[lang] || data["zh"];

      document.querySelectorAll("[data-i18n]").forEach(el => {
        const keys = el.dataset.i18n.split(".");
        let value = dict;
        for (const key of keys) value = value ? value[key] : null;
        if (value) el.textContent = value;
      });
    } catch (err) {
      console.error("语言文件加载失败:", err);
    }
  }

  loadLanguage(currentLang);

  document.getElementById("langSelect").addEventListener("change", e => {
    const newLang = e.target.value;
    localStorage.setItem("lang", newLang);
    const newUrl = `${window.location.pathname}?lang=${newLang}`;
    window.location.href = newUrl;
  });

  const map = L.map("map").setView([31, 121], 10);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18,
    attribution: '&copy; <a href="https://www.openstreetmap.org/">OSM</a> contributors',
  }).addTo(map);

  const lineStyle = {
    color: "#e11d48",
    weight: 5,
    opacity: 0.9
  };

  const dotStyle = {
    color: "#e11d48",
    radius: 4,
    weight: 1,
    opacity: 0.9,
    fillOpacity: 0.9
  };

  let currentLayer = null;
  let currentGpx = null;
  let dotsLayer = null;
  let isDotsMode = false;

  function formatDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return { y, m, d: day, full: `${y}${m}${day}` };
  }

  function buildDots(gpxLayer) {
    const dots = L.layerGroup();
    gpxLayer.eachLayer(function(layer) {
      if (layer instanceof L.Polyline) {
        const latlngs = layer.getLatLngs();
        const flat = Array.isArray(latlngs[0]) ? latlngs.flat() : latlngs;
        flat.forEach(ll => {
          L.circleMarker(ll, dotStyle).addTo(dots);
        });
      }
    });
    return dots;
  }

  function showLine() {
    if (currentGpx) currentGpx.setStyle(lineStyle);
    if (dotsLayer) map.removeLayer(dotsLayer);
    isDotsMode = false;
    const btn = document.getElementById("mode-toggle");
    btn.textContent = (currentLang === "zh" ? "散点" : "Dots");
    btn.classList.remove("active");
  }

  function showDots() {
    if (currentGpx) currentGpx.setStyle({ opacity: 0, weight: 0 });
    if (dotsLayer) dotsLayer.addTo(map);
    isDotsMode = true;
    const btn = document.getElementById("mode-toggle");
    btn.textContent = (currentLang === "zh" ? "折线" : "Line");
    btn.classList.add("active");
  }

  function toggleMode() {
    if (isDotsMode) {
      showLine();
    } else {
      showDots();
    }
  }

  async function loadDailyGpx(dateStr) {
    if (currentLayer) {
      map.removeLayer(currentLayer);
      currentLayer = null;
      currentGpx = null;
      dotsLayer = null;
    }

    const d = new Date(dateStr + "T00:00:00");
    const { y, m, d: day, full } = formatDate(d);
    const gpxPath = `./gpx/${y}/${m}/${full}.gpx`;
    const statusEl = document.getElementById("date-status");

    statusEl.textContent = "加载中...";

    const layer = L.layerGroup();
    currentLayer = layer;

    const gpx = new L.GPX(gpxPath, {
      async: true,
      markers: { startIcon: null, endIcon: null }
    })
    .on("loaded", e => {
      const g = e.target;
      g.setStyle(lineStyle);
      g.bindPopup(`<b>${dateStr}</b>`);
      currentGpx = g;
      dotsLayer = buildDots(g);

      map.fitBounds(g.getBounds(), { padding: [20, 20] });
      statusEl.textContent = `${dateStr}`;

      if (isDotsMode) showDots();
    })
    .on("error", e => {
      statusEl.textContent = "无数据";
      console.warn("GPX 加载失败:", gpxPath, e);
    })
    .addTo(layer);

    layer.addTo(map);
  }

  document.getElementById("mode-toggle").addEventListener("click", toggleMode);

  const dateInput = document.getElementById("dateInput");
  dateInput.addEventListener("change", () => {
    const val = dateInput.value;
    if (val) loadDailyGpx(val);
  });

  // 默认选中今天
  const today = new Date().toISOString().slice(0, 10);
  dateInput.value = today;
  loadDailyGpx(today);

</script>

</body>
</html>
